[build]
  functions = "netlify/functions"

# Per-venue SEO pages: /venue/29 stays as the URL shown in the browser
# (force = true so this wins over the pre-existing static sitemap.xml file
# for that one path specifically), while Netlify internally serves it from
# the venue-page function.
[[redirects]]
  from = "/venue/:id"
  to = "/.netlify/functions/venue-page?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/seat/:id"
  to = "/.netlify/functions/seat-page?id=:id"
  status = 200
  force = true

# Sitemap is generated fresh on every request from live venue data instead
# of a static file that goes stale the moment a new venue is added.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# 보안: 사이트 루트가 통째로 배포되기 때문에, 서비스와 상관없는 내부 문서·서버
# 함수 소스·예전 관리자 복사본까지 인터넷에서 그대로 열렸다. 파일은 그대로 두고
# (git/작업 지침에는 필요) 외부에서 접근할 때만 404로 막는다.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/SESSION_NOTES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/project_rules.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.agents/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

# 서버 함수 소스(netlify/functions/*.js)가 정적 파일로도 그대로 열렸다. 실제 함수는
# /.netlify/functions/ 경로로만 실행되므로(위 /venue, /seat, /sitemap.xml 규칙),
# 소스 파일 경로는 외부에서 막아도 서비스에 영향이 없다.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# 예전 관리자 페이지 복사본 (실제 관리자 페이지는 /admin.html)
[[redirects]]
  from = "/admin-site"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin-site/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# 보안 헤더 (모든 페이지)
#  · X-Frame-Options / frame-ancestors : 다른 사이트가 우리 화면을 iframe으로 덮어씌워
#    클릭을 가로채는 것(클릭재킹) 방지. 우리 사이트 안에서의 iframe은 허용.
#  · nosniff : 브라우저가 파일 형식을 멋대로 추측해 스크립트로 실행하지 않게 함
#  · Referrer-Policy : 다른 사이트로 이동할 때 주소 경로가 통째로 넘어가지 않게 함
#  · object-src 'none' / base-uri 'self' : 플러그인·<base> 태그 악용 차단
#  ※ 스크립트 출처를 제한하는 CSP(script-src)는 광고(AdSense·카카오 애드핏) 등이
#    깨질 수 있어 아직 넣지 않았다 — 필요하면 별도로 테스트하며 추가.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# 관리자 페이지: 검색 노출 금지, 캐시 금지, 어떤 사이트에서도 iframe 삽입 금지,
# 이 페이지에서는 form 전송도 자기 자신으로만 허용.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# 야구장 배치도 배경 그림: 파일 주소에 내용 해시(?v=)가 붙어 있어(docs/tools/split_stadium_svg.ps1),
# 그림이 바뀌면 주소도 바뀐다. 그래서 브라우저가 1년간 다시 받지 않고 재사용해도 안전하다.
[[headers]]
  for = "/stadiums/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 야구장 새 배치도(LAB) 주소: /stadium/<구장> , /stadium/<구장>/<구역> 은 앱(index.html) 하나로 처리하고
# 실제 화면은 브라우저 쪽 코드가 주소를 읽어서 연다. (정식 오픈 전까지 진입점은 로컬 전용)
[[redirects]]
  from = "/stadium/*"
  to = "/index.html"
  status = 200

# 야구장 배치도 "원본" SVG(배경 그림이 통째로 들어 있는 큰 파일, 로컬 개발·스크립트 입력용)는 서비스에서 쓰지 않으므로
# 외부에서 내려받지 못하게 막는다. 서비스는 가벼운 *.map.svg + *-bg.jpg 만 쓴다.
# ※ 구장을 추가할 때(예: gocheok -> incheon) 같은 형태로 원본 파일 이름을 여기에도 추가할 것.
[[redirects]]
  from = "/stadiums/gocheok.svg"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/stadiums/sangam.svg"
  to = "/404.html"
  status = 404
  force = true